name: Build and Push Docker Image to Google Artifact Registry

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: moz-fx-llm-proxy-prod-b0b8
  GAR_REPOSITORY: llm-proxy-prod
  GAR_NAME: litellm-gateway
  GAR_LOCATION: us
  GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER: projects/324168772199/locations/global/workloadIdentityPools/github-actions/providers/github-actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Read LiteLLM version
        id: litellm
        shell: bash
        run: |
          VERSION=$(sed -nE 's|^FROM ghcr.io/berriai/litellm:([^@[:space:]]+).*|\1|p' Dockerfile)
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Could not extract a valid LiteLLM version tag from Dockerfile" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          service_account: artifact-writer@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          workload_identity_provider: ${{ env.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Build and push container image
        shell: bash
        env:
          LITELLM_VERSION: ${{ steps.litellm.outputs.version }}
        run: |
          IMAGE_REPO="$GAR_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$GAR_NAME"
          docker build \
            -t "$IMAGE_REPO:$GITHUB_SHA" \
            -t "$IMAGE_REPO:latest" \
            -t "$IMAGE_REPO:$LITELLM_VERSION" \
            .
          docker push "$IMAGE_REPO:$GITHUB_SHA"
          docker push "$IMAGE_REPO:latest"
          docker push "$IMAGE_REPO:$LITELLM_VERSION"

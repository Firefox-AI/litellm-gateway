name: Publish to GAR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gar
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish tested image
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-docker.pkg.dev/moz-fx-llm-proxy-prod-b0b8/llm-proxy-prod/litellm-gateway
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check publishing configuration
        run: |
          test -n "$WIF_PROVIDER" || { echo 'Set GCP_WORKLOAD_IDENTITY_PROVIDER'; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo 'Set GCP_DEPLOY_SERVICE_ACCOUNT'; exit 1; }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
      - name: Check candidate runtime imports
        run: |
          docker run --rm --network none --entrypoint python \
            --volume "$PWD/scripts/smoke_test.py:/tmp/smoke_test.py:ro" \
            --env PYTHONPATH=/app \
            "$IMAGE:sha-$GITHUB_SHA" /tmp/smoke_test.py
      - name: Authenticate through Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Push the candidate that passed the smoke test
        run: docker push "$IMAGE:sha-$GITHUB_SHA"
